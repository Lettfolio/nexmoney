# R94 · A5: weekly dependency PRs, one grouped PR per ecosystem; each runs the battery like any other PR.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # TypeScript 7+ is the native compiler: its npm package has no JS API (transpileModule,
      # ScriptTarget), which tests/r95_unsub.js uses to run the edge function. Stay on 5.x.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
