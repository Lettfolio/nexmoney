# R91 · 1: the Playwright battery on every push to main / PR, in four shards (HARNESS.md "## CI").
# Suites hard-code REPO=/root/nx and PORT=8099, so the job runs as root in the Playwright image whose
# version matches the sandbox (1.56.0) and symlinks the checkout to /root/nx.
name: battery

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# R94 · A5: the battery only reads the repo; a pull_request job gets a read-only token whatever the repo default is.
permissions:
  contents: read

concurrency:
  group: battery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-check:
    # Same image as the shards: db/check-schema-drift.js launches Chromium to read the mock's registry.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.56.0-noble
      options: --user root
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -p jsconfig.json --noEmit
      - run: npm i --no-save playwright@1.56.0
      - run: node build.js --hash
      - run: node db/check-schema-drift.js

  # R135: eight shards, dealt by measured duration (tests/battery-weights.tsv) so they finish together —
  # about 18 minutes where four took 41.
  suites:
    needs: build-check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright:v1.56.0-noble
      options: --user root
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      BATTERY_LOGDIR: /tmp/battery-logs
    steps:
      - name: Tools the suites shell out to (git for r90_case_split's and r82_correct's base reads, python3 for the static server)
        run: apt-get update -qq && apt-get install -y -qq git python3 curl >/dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Link the checkout to /root/nx
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ln -sfn "$GITHUB_WORKSPACE" /root/nx
      - run: npm ci
      - run: npm i --no-save playwright@1.56.0
      - name: Battery shard ${{ matrix.shard }} of 8
        run: bash tests/run-battery.sh ${{ matrix.shard }} 8
      - name: Upload suite logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: battery-logs-shard-${{ matrix.shard }}
          path: /tmp/battery-logs/*.out
      - name: Upload suite timings (for re-dealing the shards)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: battery-timings-shard-${{ matrix.shard }}
          path: /tmp/battery-logs/battery.log
          if-no-files-found: ignore

  # R135: the ruleset on main requires checks named "battery (1)" … "battery (4)". These four report the
  # result of ALL eight shards under those names, so the rule keeps protecting main with no change to it.
  # (One required check would do; changing the ruleset is the owner's call.)
  battery:
    needs: suites
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: All eight shards passed
        env:
          SUITES_RESULT: ${{ needs.suites.result }}
        run: |
          echo "suites: $SUITES_RESULT"
          [ "$SUITES_RESULT" = "success" ]
