<!DOCTYPE html>
<!-- R73 · B4 — en-GB: this page renders dates and a date input for UK introducers. -->
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>NexMoney — Introducer Portal</title>
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>

<div id="login-view" class="login-wrap hidden">
  <form id="login-form" class="login-card">
    <div class="login-logo">Nex<span>Money</span></div>
    <h1>Introducer Portal</h1>
    <label>Email
      <input type="email" id="login-email" required autocomplete="username">
    </label>
    <label>Password
      <span class="pw-wrap">
        <input type="password" id="login-password" required autocomplete="current-password">
        <button type="button" class="pw-toggle" id="pw-btn" aria-label="Show password">&#128065;</button>
      </span>
    </label>
    <button type="submit" class="btn btn-primary btn-block">Sign in</button>
    <!-- R78 · B6 — the reset the invite email has promised since round 5 ("They can change it via
         Forgot password") finally exists on the page introducers actually sign in on. Same
         resetPasswordForEmail pattern as the admin app; redirectTo is THIS page, so the recovery
         link lands where an introducer account can complete it (the admin page would bounce them
         at the staff gate). -->
    <button type="button" id="forgot-btn" class="btn btn-ghost btn-block">Forgot password?</button>
    <p id="login-error" class="error hidden"></p>
  </form>
</div>

<div id="app-view" class="hidden">
  <header class="topbar">
    <div class="topbar-logo">Nex<span>Money</span> <em>Introducer&nbsp;Portal</em></div>
    <div class="topnav"></div>
    <div class="topbar-right">
      <span id="user-email"></span>
      <button id="logout-btn" class="btn btn-ghost">Sign out</button>
    </div>
  </header>
  <main>
    <!-- R78 · B6 — honest copy: this page fetches once at sign-in, it does not stream updates. -->
    <h2 id="intro-title">Your referrals</h2>
    <p class="panel-sub">Live progress of the clients you've referred to NexMoney. Refreshed each time you sign in — no need to call for updates.</p>
    <div class="panel">
      <h3>In progress</h3>
      <div id="live-list"></div>
    </div>
    <div class="panel">
      <h3>Completed / closed</h3>
      <div id="done-list"></div>
    </div>
  </main>
</div>

<div id="toast" class="toast hidden"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.7/dist/umd/supabase.js" integrity="sha384-hazsLVND17GNLVdtV19te6qbFT2YuLgl8SamcF+QR5eIOC+W4dGKrUNMxU1jH1zD" crossorigin="anonymous"></script>
<script src="/admin/introducer.js"></script>
</body>
</html>
